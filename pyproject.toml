[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kol-toolkit"
version = "0.1.0"
description = "KOL/Influencer analytics toolkit — Telegram + YouTube scraping, CPM/ER/fraud metrics, dedup, CSV/XLSX export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
telegram = ["telethon>=1.34.0"]
youtube = ["httpx>=0.27.0", "beautifulsoup4>=4.12.0"]
all = ["telethon>=1.34.0", "httpx>=0.27.0", "beautifulsoup4>=4.12.0"]

[project.scripts]
kol = "kol.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kol"]
